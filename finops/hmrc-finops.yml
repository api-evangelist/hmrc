principles:
  - name: Visibility
    description: Use the HMRC Developer Hub application dashboard to monitor request volume and 429 rates
      per registered application. Capture Request-Id correlation IDs and Gov-Client-* fraud-prevention
      header values in your observability pipeline.
  - name: Allocation
    description: Allocate engineering and integration cost by HMRC API family (VAT MTD, Self Assessment,
      PAYE, Customs Declarations, Corporation Tax). Tag traffic by tax-period and by the end-customer of
      the consuming software so internal recharge to the relevant product line is possible.
  - name: Optimization
    description: HMRC penalises batching; design submission flows around real-time user actions to stay
      under the 3 RPS per-application throttle. Cache reference data (rates, codes) where HMRC permits to
      reduce gateway pressure. If sustained throughput is required, lodge a rate-limit-uplift request with
      HMRC SDS rather than spawning multiple applications.
  - name: Accountability
    description: Assign a named owner per HMRC API integration who is responsible for software-recognition
      status, fraud-prevention header correctness, Terms-of-Use compliance, and incident response when HMRC
      issues 503 / SCHEDULED_MAINTENANCE notices.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Data Ingestion
      - Allocation
      - Reporting and Analytics
      - Anomaly Management
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Forecasting
      - Budgeting
      - Benchmarking
      - Unit Economics
  - name: Optimize Usage and Cost
    capabilities:
      - Rate Optimization
      - Workload Optimization
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - FinOps Practice Operations
      - FinOps Education and Enablement
      - Onboarding Workloads
      - Intersecting Disciplines
meters:
  - name: api_requests
    description: Count of requests sent to HMRC APIs per registered application
    unit: request
    aggregation: sum
    dimensions:
      - api
      - environment
      - application_id
      - tax_period
      - end_customer
  - name: throttled_responses
    description: Count of HTTP 429 / MESSAGE_THROTTLED_OUT responses, used as a leading indicator for
      design changes or rate-limit uplift requests
    unit: response
    aggregation: sum
    dimensions:
      - api
      - application_id
  - name: maintenance_events
    description: Count of 503 SCHEDULED_MAINTENANCE / SERVER_ERROR responses
    unit: event
    aggregation: sum
    dimensions:
      - api
  - name: recognised_software_status
    description: Indicator that the consuming product holds HMRC Recognised Software status for a given
      tax regime
    unit: status
    aggregation: max
    dimensions:
      - api
      - application_id
