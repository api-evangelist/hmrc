  billingFrequency: Not Applicable
  billingCurrency: GBP
  chargeCategories:
    - Adjustment
  chargeFrequency: Not Applicable
  notes: HMRC does not invoice for API access. Internal cost is consumer integration effort + dependent SaaS
    fees from the consuming software vendor.
