description: 'FOCUS-aligned FinOps definition for HMRC. The HMRC Developer Hub APIs themselves are zero-cost
  to consumers; FinOps for HMRC therefore tracks the indirect cost of integration (rate-limit-driven design,
  software-recognition compliance, fraud-prevention overhead) rather than direct billing. ChargeCategory
  for HMRC API usage is effectively zero / not-billed.'
