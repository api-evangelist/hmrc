naftiko: 1.0.0-alpha2
info:
  label: HMRC VAT (Making Tax Digital) API — Liabilities
  description: 'HMRC VAT (Making Tax Digital) API — Liabilities. 1 operations. Lead operation: Retrieve VAT liabilities. Self-contained
    Naftiko capability covering one Hmrc business surface.'
  tags:
  - Hmrc
  - Liabilities
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    HMRC_API_KEY: HMRC_API_KEY
capability:
  consumes:
  - type: http
    namespace: vat-mtd-liabilities
    baseUri: https://api.service.hmrc.gov.uk
    description: HMRC VAT (Making Tax Digital) API — Liabilities business capability. Self-contained, no shared references.
    resources:
    - name: organisations-vat-vrn-liabilities
      path: /organisations/vat/{vrn}/liabilities
      operations:
      - name: getvatliabilities
        method: GET
        description: Retrieve VAT liabilities
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: vrn
          in: path
          type: string
          required: true
        - name: from
          in: query
          type: string
          required: true
        - name: to
          in: query
          type: string
          required: true
        - name: Authorization
          in: header
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.HMRC_API_KEY}}'
  exposes:
  - type: rest
    namespace: vat-mtd-liabilities-rest
    port: 8080
    description: REST adapter for HMRC VAT (Making Tax Digital) API — Liabilities. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/organisations/vat/{vrn}/liabilities
      name: organisations-vat-vrn-liabilities
      description: REST surface for organisations-vat-vrn-liabilities.
      operations:
      - method: GET
        name: getvatliabilities
        description: Retrieve VAT liabilities
        call: vat-mtd-liabilities.getvatliabilities
        with:
          vrn: rest.vrn
          from: rest.from
          to: rest.to
          Authorization: rest.Authorization
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: vat-mtd-liabilities-mcp
    port: 9090
    transport: http
    description: MCP adapter for HMRC VAT (Making Tax Digital) API — Liabilities. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: retrieve-vat-liabilities
      description: Retrieve VAT liabilities
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: vat-mtd-liabilities.getvatliabilities
      with:
        vrn: tools.vrn
        from: tools.from
        to: tools.to
        Authorization: tools.Authorization
      outputParameters:
      - type: object
        mapping: $.
